name: Build and release APK

# Runs when a version tag like apk-v4 is pushed. Builds the APK, signs it
# with the project's keystore (from secrets, same signature as all previous
# builds), and attaches it to a GitHub Release. The app's self-updater
# downloads new versions from those releases.
on:
  push:
    tags:
      - "apk-v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Restore signing keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > /tmp/listing-assistant.keystore

      - name: Build signed APK
        env:
          KEYSTORE_PATH: /tmp/listing-assistant.keystore
        run: gradle assembleDebug --no-daemon

      - name: Rename APK for the release
        run: |
          TAG="${GITHUB_REF_NAME}"
          cp app/build/outputs/apk/debug/app-debug.apk "ebay-listing-assistant-${TAG}.apk"
          echo "APK_NAME=ebay-listing-assistant-${TAG}.apk" >> "$GITHUB_ENV"

      - name: Attach APK to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APK_NAME }}
          generate_release_notes: false
